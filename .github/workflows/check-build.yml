name: Check Build

on:
  pull_request:
    branches:
      - master

jobs:
  check-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check build.sha256 is up to date
        run: |
          sha256sum *.tex > build.sha256
          git diff --exit-code -- build.sha256 || (echo "Error: build.sha256 is out of date. Please run ./build.sh and commit the result." && exit 1)
